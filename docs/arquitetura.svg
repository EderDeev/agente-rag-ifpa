<circle cx="2474" cy="892" r="5" fill="#1B7F3B"/>
<text x="2492" y="900" font-size="23" fill="#1C2421">Busca por significado e palavra-chave</text>
<circle cx="2474" cy="938" r="5" fill="#1B7F3B"/>
<text x="2492" y="946" font-size="23" fill="#1C2421">Devolve trechos com documento e página</text>
