<circle cx="2474" cy="418" r="5" fill="#1B7F3B"/>
<text x="2492" y="426" font-size="23" fill="#1C2421">Decide quando consultar os documentos</text>
<circle cx="2474" cy="464" r="5" fill="#1B7F3B"/>
